<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f1e8">
  <meta name="description" content="2002 考研英语 C 模式双语精读：预生成音频、逐句朗读、零运行时 TTS。">
  <title>2002 · 英语真题精读</title>
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./catalog.css">
  <link rel="stylesheet" href="./readalong.css">
  <link rel="stylesheet" href="./reader-controls.css">
</head>
<body data-mood="warm" data-reader-ui="tap-translate-v1">
  <main class="page-shell">
    <header class="hero">
      <div class="topline">
        <span class="year-chip">2002 · Text 1</span>
        <span class="free-chip">预生成 · 零运行时 TTS</span>
      </div>
      <h1 id="article-title">把真题读懂，也听懂</h1>
      <p class="subtitle">逐句中英对照 · 理解导向的美式日常交流式朗读</p>
      <nav class="catalog-controls" aria-label="试卷文章目录">
        <label>年份<select id="year-select"><option>2002</option></select></label>
        <label>题型<select id="section-select"><option value="">全部</option><option value="cloze">完型</option><option value="reading">阅读</option><option value="translation">翻译</option></select></label>
        <label class="article-control">文章<select id="article-select" aria-label="选择文章"></select></label>
      </nav>
      <p id="content-status" class="content-status" aria-live="polite">正在加载2002年目录</p>
      <div class="director-card">
        <div class="director-icon">🎬</div>
        <div><div class="director-title">这篇文章怎么读</div><p id="article-background"></p></div>
      </div>
      <div class="reader-settings">
        <span>先读英文，轻点查译文</span>
        <button id="toggle-vocab" class="vocab-toggle" type="button" role="switch" aria-checked="true" aria-label="6级及以上难词双语标注"><span>难词 6+</span><i aria-hidden="true"></i></button>
      </div>
    </header>
    <section class="howto" aria-label="使用方法"><span>轻点句框查译文</span><b>·</b><span>长按文字复制</span><b>·</b><span>点序号播放</span></section>
    <section id="sentence-list" class="sentence-list" aria-label="2002 Text 1 双语精读"></section>
    <footer class="footer-note">只读真题正文，不含题目选项和作文。词汇使用本项目1—9级学习标尺，6级及以上突出显示，并非官方词汇分级。音频为预生成候选版，播放时不调用TTS。<a href="./THIRD_PARTY_AUDIO_NOTICE.txt" target="_blank" rel="noopener">音频来源与许可</a></footer>
  </main>
  <aside id="player-shell" class="player-shell" aria-label="朗读播放器">
    <div class="progress-track"><div id="progress-fill" class="progress-fill"></div></div>
    <div class="player-meta"><div><div id="player-position" class="player-position">01 / 21</div><div id="director-mood" class="director-mood">温暖讲解 · 1</div></div><div id="player-status" class="player-status">正在加载音频清单</div></div>
    <div class="transport-row">
      <button id="previous" class="icon-button" type="button" aria-label="上一句">‹</button>
      <button id="replay" class="icon-button" type="button" aria-label="重播本句">↺</button>
      <button id="play-toggle" class="play-button" type="button" aria-label="播放">▶</button>
      <button id="next" class="icon-button" type="button" aria-label="下一句">›</button>

    </div>
    <div id="speed-control" class="magnetic-speed" style="--speed-position:25%">
      <label class="speed-label" for="speed-range">倍速</label>
      <div class="speed-track">
        <output class="speed-bubble" aria-hidden="true">1.0×</output>
        <input id="speed-range" type="range" min="0" max="4" step="0.01" value="1" aria-label="朗读倍速，五档磁吸" aria-valuetext="1.0×">
        <div class="speed-ticks" aria-hidden="true"><span data-stop="0">0.7</span><span data-stop="1" class="is-selected">1.0</span><span data-stop="2">1.25</span><span data-stop="3">1.5</span><span data-stop="4">2.0</span></div>
      </div>
      <button id="speed-value" class="speed-value" type="button" aria-label="按住并左右滑动调整倍速">1.0×</button>
    </div>
  </aside>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="./app.js?v=tap-translate-v1"></script>
</body>
</html>
