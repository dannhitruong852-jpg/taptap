name: Reader tests

on:
  workflow_dispatch:
  push:
    branches: ['c-v4-article-preview-actual']
    paths:
      - 'kaoyan-reader-v1/**'
      - 'docs/standards/PLAYBACK_LATENCY_STANDARD.md'
      - '.github/workflows/reader-tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run reader unit and contract tests
        working-directory: kaoyan-reader-v1
        run: npm test
