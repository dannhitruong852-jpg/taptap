name: Cancel duplicate production once

on:
  push:
    branches:
      - c-mode-v2-2013-2018-production
    paths:
      - '.github/workflows/cancel-duplicate-production-once.yml'

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel duplicate queued production run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "/repos/$GITHUB_REPOSITORY/actions/runs/35301235080/cancel"
          echo "Cancelled duplicate run 35301235080" >> "$GITHUB_STEP_SUMMARY"
