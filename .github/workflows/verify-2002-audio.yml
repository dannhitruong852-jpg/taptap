name: Verify complete 2002 audio delivery

on:
  push:
    branches: [kaoyan-reader-v1]
    paths:
      - '.github/workflows/verify-2002-audio.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify delivery-check regression tests and rebuild exact content
        run: |
          PYTHONPATH=voice-pipeline python -m unittest discover -s voice-pipeline/tests -p test_verify_2002_audio.py -v
          PYTHONPATH=content-pipeline python content-pipeline/build_2002.py
      - name: Install audio decoder and real browser
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Wait for the already-running generation and publication, without generating again
        run: |
          for attempt in $(seq 1 80); do
            state=$(gh api repos/$GITHUB_REPOSITORY/actions/runs/34677970587 --jq '.status')
            echo "Existing audio run: $state"
            if [ "$state" = completed ]; then exit 0; fi
            sleep 15
          done
          echo 'Existing run has not finished; no completion claim is made.' >&2
          exit 1
      - name: Verify all 165 published segments, both formats, hashes, and decoding
        run: |
          for attempt in $(seq 1 8); do
            if PYTHONPATH=voice-pipeline python voice-pipeline/verify_2002_audio.py --destination /tmp/2002-delivery/kaoyan-reader-v1; then exit 0; fi
            echo "Live publication not fully verified, attempt $attempt"
            sleep 15
          done
          exit 1
      - name: Play every real segment in Opus and MP3, plus mobile controls
        run: python kaoyan-reader-v1/tests/audio-browser-check.py --root /tmp/2002-delivery/kaoyan-reader-v1 --report-dir /tmp/2002-delivery/reports/browser
      - name: Preserve verification reports
        if: always()
        run: |
          mkdir -p /tmp/2002-delivery/reports/qa
          if [ -f reports/qa/2002-live-audio.json ]; then cp reports/qa/2002-live-audio.json /tmp/2002-delivery/reports/qa/; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 2002-complete-audio-delivery
          path: /tmp/2002-delivery
          if-no-files-found: warn
          retention-days: 14
