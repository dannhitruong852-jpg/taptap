name: Materialize bilingual highlights

on:
  workflow_dispatch:
  push:
    branches: ['c-v4-article-preview-actual']
    paths: ['bilingual-materialize.trigger']

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c-v4-article-preview-actual
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile canonical article content
        env:
          PYTHONPATH: voice-pipeline:content-pipeline
        run: |
          for year in 2003 2004 2005 2006; do
            python content-pipeline/build_curated_year.py --year "$year"
          done
      - name: Materialize audited bilingual editorial mappings
        env:
          PYTHONPATH: voice-pipeline:content-pipeline
        run: python content-pipeline/author_bilingual_highlights_2003_2006.py
      - name: Validate and compile all bilingual mappings
        env:
          PYTHONPATH: voice-pipeline:content-pipeline
        run: |
          for year in 2003 2004 2005 2006; do
            python content-pipeline/build_bilingual_highlights.py --year "$year"
          done
      - name: Require complete reviewed coverage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          expected={2003:71,2004:85,2005:24,2006:28}
          for year,count in expected.items():
              report=json.loads(Path(f'reports/bilingual-highlights/{year}.json').read_text())
              assert report['errors']==[],report
              assert report['required_occurrences']==count,(year,report)
              assert report['required_occurrences']==report['mapped_occurrences']+report['reviewed_exceptions'],report
              assert report['reviewed_exceptions']==0,report
              print(year,report)
          PY
      - name: Commit reviewed mapping data and compiled reader files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content-pipeline/curated/bilingual-highlights/2003.json \
                  content-pipeline/curated/bilingual-highlights/2004.json \
                  content-pipeline/curated/bilingual-highlights/2005.json \
                  content-pipeline/curated/bilingual-highlights/2006.json \
                  kaoyan-reader-v1/content/2003/bilingual-highlights.json \
                  kaoyan-reader-v1/content/2004/bilingual-highlights.json \
                  kaoyan-reader-v1/content/2005/bilingual-highlights.json \
                  kaoyan-reader-v1/content/2006/bilingual-highlights.json \
                  reports/bilingual-highlights/2003.json \
                  reports/bilingual-highlights/2004.json \
                  reports/bilingual-highlights/2005.json \
                  reports/bilingual-highlights/2006.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No materialized bilingual changes to commit.'
          else
            git commit -m 'data: materialize reviewed bilingual highlights for 2003-2006'
            git push origin HEAD:c-v4-article-preview-actual
          fi
