name: Generate 2002 Text 1 B2 pilot

on:
  workflow_dispatch:
  push:
    branches: [kaoyan-reader-v1]
    paths:
      - '.github/workflows/generate-text1-pilot.yml'
      - 'voice-pipeline/generate_text1.py'
      - 'voice-pipeline/render.py'
      - 'voice-pipeline/config/**'
      - 'voice-pipeline/references/sources.json'
      - 'kaoyan-reader-v1/content/2002/text1.json'

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system audio tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Chatterbox and Parquet reader
        run: |
          python -m pip install --upgrade pip
          python -m pip install chatterbox-tts pyarrow

      - name: Download licensed CMU Arctic pilot references from Hugging Face mirror
        run: |
          mkdir -p /tmp/cmu-arctic voice-pipeline/references/generated
          curl -L --fail --retry 3 -o /tmp/cmu-arctic/bdl.parquet 'https://huggingface.co/datasets/MikhailT/cmu-arctic/resolve/main/data/bdl-00000-of-00001-0c683a89629915f1.parquet?download=true'
          curl -L --fail --retry 3 -o /tmp/cmu-arctic/jmk.parquet 'https://huggingface.co/datasets/MikhailT/cmu-arctic/resolve/main/data/jmk-00000-of-00001-1e65c0fe4d8b0b42.parquet?download=true'
          curl -L --fail --retry 3 -o /tmp/cmu-arctic/rms.parquet 'https://huggingface.co/datasets/MikhailT/cmu-arctic/resolve/main/data/rms-00000-of-00001-0f0762376a6ef8cc.parquet?download=true'

      - name: Build 12-20 second reference clips
        run: |
          python - <<'PY'
          import io
          import wave
          from pathlib import Path
          import pyarrow.parquet as pq

          specs = {
              'actor05-neutral.wav': Path('/tmp/cmu-arctic/bdl.parquet'),
              'actor12-neutral.wav': Path('/tmp/cmu-arctic/jmk.parquet'),
              'actor13-neutral.wav': Path('/tmp/cmu-arctic/rms.parquet'),
          }
          outdir = Path('voice-pipeline/references/generated')
          outdir.mkdir(parents=True, exist_ok=True)

          for outname, parquet_path in specs.items():
              table = pq.read_table(parquet_path, columns=['audio']).slice(0, 8)
              rows = table.column('audio').to_pylist()
              frames = []
              params = None
              for row in rows:
                  data = row['bytes']
                  if not data:
                      raise RuntimeError(f'missing embedded audio bytes in {parquet_path}')
                  with wave.open(io.BytesIO(data), 'rb') as w:
                      current = (w.getnchannels(), w.getsampwidth(), w.getframerate())
                      if params is None:
                          params = current
                      if current != params:
                          raise RuntimeError(f'format mismatch in {parquet_path}')
                      frames.append(w.readframes(w.getnframes()))
              with wave.open(str(outdir / outname), 'wb') as out:
                  out.setnchannels(params[0])
                  out.setsampwidth(params[1])
                  out.setframerate(params[2])
                  out.writeframes(b''.join(frames))
          PY
          for f in voice-pipeline/references/generated/*.wav; do
            ffmpeg -y -i "$f" -t 18 -af "loudnorm=I=-20:TP=-2:LRA=7" "${f%.wav}-trim.wav"
            mv "${f%.wav}-trim.wav" "$f"
            ffprobe -v error -show_entries format=duration -of default=nw=1 "$f"
          done

      - name: Run deterministic unit tests
        run: |
          PYTHONPATH=voice-pipeline python -m unittest discover -s voice-pipeline/tests -p 'test_*.py'

      - name: Generate all 24 B2 segments
        env:
          HF_HOME: ${{ runner.temp }}/hf-cache
        run: |
          python voice-pipeline/generate_text1.py

      - name: Validate generated pilot
        run: |
          test "$(find kaoyan-reader-v1/audio/2002/text1 -name '*.opus' | wc -l)" -eq 24
          python - <<'PY'
          import json
          m=json.load(open('kaoyan-reader-v1/audio/2002/text1/manifest.json'))
          assert len(m['segments']) == 24
          assert list(m['segments'])[:3] == ['s01-a','s02-a','s03-a']
          print('manifest-ok: 24 segments')
          PY

      - name: Upload complete pilot candidate
        uses: actions/upload-artifact@v4
        with:
          name: 2002-text1-b2-pilot
          path: |
            kaoyan-reader-v1/audio/2002/text1/*.opus
            kaoyan-reader-v1/audio/2002/text1/manifest.json
          if-no-files-found: error
          retention-days: 7
