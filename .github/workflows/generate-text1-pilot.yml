name: Generate 2002 Text 1 B2 pilot

# Archived engineering pilot: still runnable, but not regenerated by C-mode edits.
on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install original pipeline dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install chatterbox-tts==0.1.7 pyarrow
      - name: Prepare original three licensed reference voices
        run: python voice-pipeline/prepare_2002_references.py
      - name: Verify pure pipeline helpers
        run: PYTHONPATH=voice-pipeline python -m unittest discover -s voice-pipeline/tests -p 'test_*.py'
      - name: Generate original 24-segment B2 engineering pilot
        env:
          HF_HOME: ${{ runner.temp }}/hf-cache
        run: python voice-pipeline/generate_text1.py
      - name: Validate original manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('kaoyan-reader-v1/audio/2002/text1')
          assert len(list(root.glob('*.opus')))==24
          assert len(json.loads((root/'manifest.json').read_text())['segments'])==24
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: 2002-text1-b2-pilot
          path: |
            kaoyan-reader-v1/audio/2002/text1/*.opus
            kaoyan-reader-v1/audio/2002/text1/manifest.json
          if-no-files-found: error
          retention-days: 7
