name: 2002 C v3 content-selected cast

on:
  push:
    branches: [kaoyan-reader-v1]
    paths:
      - '.github/workflows/generate-2002-c-v3.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: 2002-c-v3-content-cast
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild 2002 with content-selected actors
        run: |
          PYTHONPATH=content-pipeline python content-pipeline/build_2002.py
          PYTHONPATH=voice-pipeline python voice-pipeline/apply_2002_cast.py
      - name: Require cast, content, voice and reader contracts
        run: |
          PYTHONPATH=content-pipeline python -m unittest discover -s content-pipeline/tests -v
          PYTHONPATH=voice-pipeline python -m unittest discover -s voice-pipeline/tests -v
          cd kaoyan-reader-v1 && npm test

  references:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        actor: ['01','02','04','05','08','09','12','13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install reference-audio tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install numpy==1.26.4 soundfile==0.13.1
      - name: Prepare licensed same-speaker expression variants
        run: python voice-pipeline/prepare_2002_cast_references.py --actor '${{ matrix.actor }}' --output voice-pipeline/references/2002-cast
      - uses: actions/upload-artifact@v4
        with:
          name: 2002-c-v3-reference-${{ matrix.actor }}
          path: voice-pipeline/references/2002-cast
          if-no-files-found: error
          retention-days: 7

  render:
    needs: references
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 18
      matrix:
        article: [cloze, text1, text2, text3, text4, translation]
        shard: [0, 1, 2]
    env:
      HF_HOME: /tmp/chatterbox-hf-cache
      TTS_THREADS: '4'
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Rebuild exact directed content
        run: |
          PYTHONPATH=content-pipeline python content-pipeline/build_2002.py
          PYTHONPATH=voice-pipeline python voice-pipeline/apply_2002_cast.py
      - uses: actions/download-artifact@v4
        with:
          pattern: 2002-c-v3-reference-*
          path: voice-pipeline/references/2002-cast
          merge-multiple: true
      - uses: actions/cache@v4
        with:
          path: /tmp/chatterbox-hf-cache
          key: chatterbox-original-en-017-v1
      - uses: actions/cache@v4
        with:
          path: kaoyan-reader-v1/audio/2002/c-${{ matrix.article }}
          key: c2002-v3-${{ matrix.article }}-${{ matrix.shard }}-${{ hashFiles('content-pipeline/curated/2002.json', 'content-pipeline/build_2002.py', 'voice-pipeline/config/cast_2002.json', 'voice-pipeline/generate_2002_v3.py') }}
          restore-keys: |
            c2002-v3-${{ matrix.article }}-${{ matrix.shard }}-
      - name: Install original English Chatterbox
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install chatterbox-tts==0.1.7
      - name: Render C v3 chunks with selected actor plus emotion reference
        run: python voice-pipeline/generate_2002_v3.py --article '${{ matrix.article }}' --shard '${{ matrix.shard }}' --shards 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 2002-c-v3-${{ matrix.article }}-shard${{ matrix.shard }}
          path: kaoyan-reader-v1/audio/2002/c-${{ matrix.article }}
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [prepare, references, render]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
      pages: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kaoyan-reader-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild exact content and merge runtime
        run: |
          PYTHONPATH=content-pipeline python content-pipeline/build_2002.py
          PYTHONPATH=voice-pipeline python voice-pipeline/apply_2002_cast.py
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          mkdir -p /tmp/2002-v3-audio
      - uses: actions/download-artifact@v4
        with:
          pattern: 2002-c-v3-*-shard*
          path: /tmp/2002-v3-audio
      - name: Assemble all 91 seamless sentences
        run: PYTHONPATH=voice-pipeline python voice-pipeline/merge_2002_v3.py --incoming /tmp/2002-v3-audio
      - name: Verify every v3 Opus and MP3 sentence before publishing
        run: PYTHONPATH=voice-pipeline python voice-pipeline/verify_2002_v3.py
      - name: Re-run all deterministic test suites
        run: |
          PYTHONPATH=content-pipeline python -m unittest discover -s content-pipeline/tests -v
          PYTHONPATH=voice-pipeline python -m unittest discover -s voice-pipeline/tests -v
          cd kaoyan-reader-v1 && npm test
      - name: Commit only tested 2002 content-cast assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add kaoyan-reader-v1/content/2002/c kaoyan-reader-v1/content/catalog.json kaoyan-reader-v1/audio/2002/c-* reports/extraction/2002*.json reports/qa/2002-c-v3-*.json
          if ! git diff --cached --quiet; then
            git commit -m 'audio: publish 2002 C v3 content-selected cast'
            git push origin HEAD:kaoyan-reader-v1
          fi
      - name: Publish reader to existing Pages site
        run: bash scripts/publish-reader.sh
      - name: Smoke-check public v3 manifests
        run: |
          python - <<'PY'
          import json,time,urllib.request
          base='https://dannhitruong852-jpg.github.io/taptap/kaoyan-reader-v1/'
          articles=['cloze','text1','text2','text3','text4','translation']
          for attempt in range(36):
              try:
                  total=0
                  for article in articles:
                      url=f'{base}audio/2002/c-{article}/manifest.json?verify=v3-{attempt}'
                      m=json.load(urllib.request.urlopen(url,timeout=20))
                      assert m['c_mode_version']=='v3-content-cast',article
                      assert m['v3_status']=='complete_candidate',article
                      total+=len(m['sentences'])
                  assert total==91,total
                  print('Public v3 manifests expose all 91 sentence assets');break
              except Exception as exc:
                  print(exc,flush=True)
                  if attempt==35:raise
                  time.sleep(5)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 2002-c-v3-final-status
          path: |
            reports/qa/2002-c-v3-content-cast.json
            reports/qa/2002-c-v3-verification.json
            kaoyan-reader-v1/audio/2002/c-*/manifest.json
          if-no-files-found: warn
          retention-days: 14
