name: Test launch asset migration

on:
  push:
    branches: [c-v4-article-preview-actual]
    paths:
      - 'scripts/tests/test_migrate_2007_2012_launch_assets.py'
      - 'scripts/migrate_2007_2012_launch_assets.py'
      - '.github/workflows/test-launch-asset-migration.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest scripts/tests/test_migrate_2007_2012_launch_assets.py -v
