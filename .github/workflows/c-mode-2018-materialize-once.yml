name: C Mode 2018 materialize once

on:
  push:
    branches:
      - c-mode-v2-2013-2018-production
    paths:
      - '.github/workflows/c-mode-2018-materialize-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c-mode-v2-2013-2018-production
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build 2018 curated reader content
        env:
          PYTHONPATH: .:voice-pipeline:content-pipeline
        run: |
          python content-pipeline/build_curated_year.py --year 2018
          python content-pipeline/build_bilingual_highlights.py --year 2018
      - name: Run content regression tests
        env:
          PYTHONPATH: .:voice-pipeline:content-pipeline
        run: |
          python -m unittest \
            content-pipeline/tests/test_bilingual_highlights.py \
            content-pipeline/tests/test_build_bilingual_highlights.py \
            content-pipeline/tests/test_build_curated_year.py -v
      - name: Verify 2018 bilingual report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('reports/bilingual-highlights/2018.json').read_text(encoding='utf-8'))
          assert report['year'] == 2018, report
          assert report['required_occurrences'] == 0, report
          assert report['mapped_occurrences'] == 0, report
          assert report['reviewed_exceptions'] == 0, report
          assert report['errors'] == [], report
          article_dir=Path('kaoyan-reader-v1/content/2018/c')
          docs=sorted(article_dir.glob('*.json'))
          assert len(docs) == 7, [p.name for p in docs]
          mapping=json.loads(Path('kaoyan-reader-v1/content/2018/bilingual-highlights.json').read_text(encoding='utf-8'))
          assert mapping == {'year':2018,'articles':{},'exceptions':[]}, mapping
          print(json.dumps({'year':2018,'articles':len(docs),'bilingual_report':report},ensure_ascii=False))
          PY
      - name: Commit verified 2018 materialized outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            kaoyan-reader-v1/content/2018 \
            kaoyan-reader-v1/content/catalog.json \
            content-pipeline/voice_profiles/2018.json \
            content-pipeline/direction/2018.json \
            reports/bilingual-highlights/2018.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No materialized 2018 changes to commit.'
          else
            git commit -m '[skip ci] stage: materialize verified 2018 C Mode content'
            git push origin HEAD:c-mode-v2-2013-2018-production
          fi
