name: Audit C-mode 2007-2012 once

on:
  push:
    branches:
      - c-v4-article-preview-actual
    paths:
      - '.github/workflows/audit-c-mode-2007-2012-once.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c-v4-article-preview-actual
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit all 42 candidate discourse profiles for C-mode density
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import sys
          sys.path.insert(0, 'voice-pipeline')
          from batch_schema import validate_c_mode_density

          low_discourse={'qualify','settle','example','report'}
          errors=[]
          for year in range(2007,2013):
              for unit in ('cloze','text1','text2','text3','text4','partb','translation'):
                  doc=json.loads(Path(f'reports/content-freeze/{year}/{unit}.candidate.json').read_text(encoding='utf-8'))
                  rows=doc['article']['rows']
                  levels=['low' if row[3] in low_discourse else ('strong' if row[3] in {'action_turn','irony','evaluation_quote'} else 'micro') for row in rows]
                  bad=[]
                  for i in range(len(levels)-2):
                      if all(x=='low' for x in levels[i:i+3]):
                          bad.append({'sentences':f'{i+1}-{i+3}','discourse':[rows[j][3] for j in range(i,i+3)]})
                  if bad:
                      errors.append({'year':year,'unit':unit,'bad_windows':bad})
          print(json.dumps({'articles_with_density_errors':len(errors),'errors':errors},ensure_ascii=False))
          PY
