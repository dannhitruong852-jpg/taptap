name: Phrasebook target top TDD

on:
  push:
    branches: ['fix-phrasebook-target-top-20260929']
    paths:
      - 'kaoyan-reader-v1/**'
      - '.github/workflows/phrasebook-target-top-tdd.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            kaoyan-reader-v1
          sparse-checkout-cone-mode: true
          filter: blob:none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install reader test dependencies
        working-directory: kaoyan-reader-v1
        run: npm ci
      - name: Run reader unit tests
        working-directory: kaoyan-reader-v1
        run: npm test
      - name: Run phrasebook DOM regressions
        working-directory: kaoyan-reader-v1
        run: npm run test:dom
