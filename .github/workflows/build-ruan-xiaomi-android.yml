name: Build Ruan Xiaomi Android APK

on:
  push:
    branches: ['ruan-xiaomi-android-app']
    paths:
      - 'ruan-xiaomi-android/**'
      - '.github/workflows/build-ruan-xiaomi-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ruan-xiaomi-android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Install Android SDK 35
        shell: bash
        run: |
          SDKMANAGER=$(find "${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build installable debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify five final PNG launcher icons
        shell: bash
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          rm -rf /tmp/ruan-icons
          mkdir -p /tmp/ruan-icons
          for i in 1 2 3 4 5; do
            unzip -p "$APK" "res/mipmap-xxxhdpi-v4/icon_day_${i}.png" > "/tmp/ruan-icons/icon_day_${i}.png"
            file "/tmp/ruan-icons/icon_day_${i}.png" | tee "/tmp/ruan-icons/icon_day_${i}.txt"
            grep -Eq 'PNG image data, 192 x 192' "/tmp/ruan-icons/icon_day_${i}.txt"
          done
          if unzip -l "$APK" | grep -Eq 'res/mipmap-xxxhdpi-v4/icon_day_6\.(png|jpg)$'; then
            echo "Unexpected sixth launcher icon packaged"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ruan-xiaomi-debug-apk-v0.1.2
          path: ruan-xiaomi-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
