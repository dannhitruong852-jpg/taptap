name: Build Ruan Xiaomi Android APK

on:
  push:
    branches: ['ruan-xiaomi-android-app']
    paths:
      - 'ruan-xiaomi-android/**'
      - '.github/workflows/build-ruan-xiaomi-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ruan-xiaomi-android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Install Android SDK 35
        shell: bash
        run: |
          SDKMANAGER=$(find "${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Verify source launcher icon bytes
        shell: bash
        run: |
          sha256sum -c <<'EOF'
          ce3c8fded694a69178e1fb1208b58091ef5c9b6098a7f20aa62708f2ffec6ff6  app/src/main/res/mipmap-xxxhdpi/icon_day_1.jpg
          019f980d744afc453204c077b82136553df408fc3e019709634e22c93d05cda2  app/src/main/res/mipmap-xxxhdpi/icon_day_2.jpg
          8cda3120529732ddfc2c1c2c58e718c79776421cade4bec9e18906c867198cca  app/src/main/res/mipmap-xxxhdpi/icon_day_3.jpg
          5aa57fbc95a55d902c58b1cb9d4b95964298e252e98755bc3f9c4e3c8be300f8  app/src/main/res/mipmap-xxxhdpi/icon_day_4.jpg
          a442727cb6e9935f0ab8915d335f8ef5c7b00d0dcb74d9303c22837c1853abeb  app/src/main/res/mipmap-xxxhdpi/icon_day_5.jpg
          EOF
          for i in 1 2 3 4 5; do
            file "app/src/main/res/mipmap-xxxhdpi/icon_day_${i}.jpg" | grep -Eq 'JPEG image data.*192x192'
          done

      - name: Build installable debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify packaged launcher icons byte-for-byte
        shell: bash
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          rm -rf /tmp/ruan-icons
          mkdir -p /tmp/ruan-icons
          for i in 1 2 3 4 5; do
            SRC="app/src/main/res/mipmap-xxxhdpi/icon_day_${i}.jpg"
            OUT="/tmp/ruan-icons/icon_day_${i}.jpg"
            unzip -p "$APK" "res/mipmap-xxxhdpi-v4/icon_day_${i}.jpg" > "$OUT"
            file "$OUT" | tee "/tmp/ruan-icons/icon_day_${i}.txt"
            grep -Eq 'JPEG image data.*192x192' "/tmp/ruan-icons/icon_day_${i}.txt"
            cmp "$SRC" "$OUT"
          done
          if unzip -l "$APK" | grep -Eq 'res/mipmap-xxxhdpi-v4/icon_day_6\.(png|jpg)$'; then
            echo "Unexpected sixth launcher icon packaged"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ruan-xiaomi-debug-apk-v0.1.3-fixed-icons
          path: ruan-xiaomi-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
