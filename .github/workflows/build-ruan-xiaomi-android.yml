name: Build Ruan Xiaomi Android APK

on:
  push:
    branches: ['ruan-xiaomi-android-app']
    paths:
      - 'ruan-xiaomi-android/**'
      - '.github/workflows/build-ruan-xiaomi-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ruan-xiaomi-android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build installable debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ruan-xiaomi-debug-apk
          path: ruan-xiaomi-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
