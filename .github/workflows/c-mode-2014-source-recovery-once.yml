name: C Mode 2014 source recovery once

on:
  push:
    branches:
      - c-mode-v2-2013-2018-production
    paths:
      - '.github/workflows/c-mode-2014-source-recovery-once.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c-mode-v2-2013-2018-production
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Find unique missing Base64 character anywhere in part00
        run: |
          python - <<'PY'
          import base64, gzip, json, time
          from pathlib import Path

          root=Path('content-pipeline/curated')
          parts=[(root/f'2014.json.gz.b64.part{i:02d}').read_text(encoding='ascii').strip() for i in range(5)]
          print('part lengths:', [len(x) for x in parts])
          assert len(parts[0]) == 5999, len(parts[0])
          suffix=''.join(parts[1:])
          alphabet='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/'
          candidates=[]
          started=time.time()
          attempts=0
          for pos in range(len(parts[0]) + 1):
              prefix=parts[0][:pos]
              tail=parts[0][pos:] + suffix
              for ch in alphabet:
                  attempts += 1
                  encoded=prefix + ch + tail
                  encoded += '=' * (-len(encoded) % 4)
                  try:
                      raw=base64.b64decode(encoded, validate=True)
                      payload=gzip.decompress(raw)
                  except Exception:
                      continue
                  try:
                      doc=json.loads(payload.decode('utf-8'))
                  except Exception:
                      continue
                  if doc.get('year') == 2014 and isinstance(doc.get('articles'), list):
                      candidates.append({
                          'position': pos,
                          'char': ch,
                          'articles': len(doc['articles']),
                          'source_sha256': doc.get('source_sha256'),
                      })
              if pos and pos % 500 == 0:
                  print(f'checked positions through {pos}; candidates={len(candidates)}; elapsed={time.time()-started:.1f}s')
          print('attempts:', attempts)
          print('valid candidates:', candidates)
          if len(candidates) != 1:
              raise SystemExit(f'expected exactly one valid recovery candidate, found {len(candidates)}')
          c=candidates[0]
          print(f"UNIQUE_RECOVERY_POSITION={c['position']}")
          print(f"UNIQUE_RECOVERY_CHAR={c['char']}")
          PY
