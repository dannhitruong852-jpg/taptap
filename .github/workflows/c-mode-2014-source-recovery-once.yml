name: C Mode 2014 source recovery once

on:
  push:
    branches:
      - c-mode-v2-2013-2018-production
    paths:
      - '.github/workflows/c-mode-2014-source-recovery-once.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c-mode-v2-2013-2018-production
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Recover valid plaintext prefix before deflate corruption
        run: |
          python - <<'PY'
          import base64, json, zlib
          from pathlib import Path

          root=Path('content-pipeline/curated')
          parts=[(root/f'2014.json.gz.b64.part{i:02d}').read_text(encoding='ascii').strip() for i in range(5)]
          encoded=''.join(parts)
          encoded += '=' * (-len(encoded) % 4)
          raw=base64.b64decode(encoded, validate=True)
          dec=zlib.decompressobj(16 + zlib.MAX_WBITS)
          out=[]
          failure=None
          for i, byte in enumerate(raw):
              try:
                  piece=dec.decompress(bytes([byte]))
                  if piece:
                      out.append(piece)
              except zlib.error as exc:
                  failure=(i, str(exc))
                  break
          plaintext=b''.join(out).decode('utf-8', errors='replace')
          print('failure:', failure)
          print('recovered_plaintext_chars:', len(plaintext))
          print('--- PLAINTEXT PREFIX START ---')
          print(plaintext[:20000])
          print('--- PLAINTEXT PREFIX END ---')
          print('--- PLAINTEXT TAIL START ---')
          print(plaintext[-8000:])
          print('--- PLAINTEXT TAIL END ---')
          # Detect whether the vocabulary object is already syntactically closed
          marker='"vocabulary"'
          idx=plaintext.find(marker)
          print('vocabulary_marker_index:', idx)
          if idx >= 0:
              print('vocabulary_context:', plaintext[idx:idx+12000])
          PY
