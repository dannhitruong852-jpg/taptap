name: Cancel duplicate C Mode V2 run once

on:
  push:
    branches:
      - c-mode-v2-2013-2018-production
    paths:
      - '.github/workflows/cancel-duplicate-c-mode-v2-once.yml'

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel duplicate pending production run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel 35301235080 -R "$GITHUB_REPOSITORY"
