name: C v4 actor calibration auditions

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: c-v4-actor-auditions-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify actor-local calibration contracts
        run: PYTHONPATH=voice-pipeline python -m unittest voice-pipeline/tests/test_actor_calibration.py -v

  audition:
    needs: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        actor: ['01', '02', '04', '05', '08', '09', '12', '13']
    env:
      HF_HOME: /tmp/chatterbox-hf-cache
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/cache@v4
        with:
          path: /tmp/chatterbox-hf-cache
          key: chatterbox-original-en-017-v1
      - name: Install original English Chatterbox and audio tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install chatterbox-tts==0.1.7 numpy==1.26.4 soundfile==0.13.1
      - name: Prepare this actor's licensed EARS references
        run: python voice-pipeline/prepare_2002_cast_references.py --actor '${{ matrix.actor }}' --output /tmp/references
      - name: Render common ten-scene A/B/C battery
        run: |
          python voice-pipeline/calibration/render_auditions.py \
            --actor '${{ matrix.actor }}' \
            --references /tmp/references \
            --output 'audition-package/audio/actor${{ matrix.actor }}' \
            --device cpu
      - name: Upload this actor's playable audition set
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c-v4-audition-actor-${{ matrix.actor }}
          path: audition-package
          if-no-files-found: error
          retention-days: 14

  board:
    needs: audition
    if: always() && needs.audition.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: c-v4-audition-actor-*
          path: /tmp/downloads
          merge-multiple: true
      - name: Build static actor-to-scene comparison board
        run: |
          mkdir -p audition-board
          cp -R /tmp/downloads/audio audition-board/audio
          python voice-pipeline/calibration/build_audition_board.py \
            --manifests /tmp/downloads \
            --output audition-board/board
      - name: Confirm 240 playable candidates and pending human QA
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('audition-board/board/auditions.json').read_text())
          assert len(data['actors']) == 8
          assert sum(len(actor['renders']) for actor in data['actors']) == 240
          assert data['human_voice_qa'] == 'pending'
          assert all(not actor['eligible'] for actor in data['actors'])
          assert len(list(Path('audition-board/audio').rglob('*.opus'))) == 240
          assert len(list(Path('audition-board/audio').rglob('*.mp3'))) == 240
          PY
      - name: Upload playable comparison board
        uses: actions/upload-artifact@v4
        with:
          name: c-v4-actor-audition-board
          path: audition-board
          if-no-files-found: error
          retention-days: 14
