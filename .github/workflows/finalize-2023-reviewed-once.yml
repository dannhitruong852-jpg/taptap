name: Finalize reviewed 2023 curated once

on:
  push:
    branches:
      - c-mode-v2-2019-2024-production
    paths:
      - '.github/workflows/finalize-2023-reviewed-once.yml'

permissions:
  contents: write

env:
  PYTHONPATH: .:voice-pipeline:content-pipeline

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Materialize reviewed 2023 curated source
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path
          sys.path.insert(0, 'content-pipeline')
          from build_curated_year import load_curated_source

          curated = Path('content-pipeline/curated')
          source = load_curated_source(curated, 2023)

          expected_ids = ['cloze','text1','text2','text3','text4','partb','translation']
          assert [a['id'] for a in source['articles']] == expected_ids
          assert source['source_sha256'] == '91de84dad565eefd8ec245aa5b6291d336664c1549b6c4bff901594aed044f34'
          assert source.get('unresolved_sections') == []

          partb = next(a for a in source['articles'] if a['id'] == 'partb')
          fixes = {
              10: (
                  '他解释说：“最大的变化与供暖和保温有关。',
                  '他解释说：“最大的变化与供暖和保温有关。”',
              ),
              14: (
                  '他说：“为了防止热量流失，窗户、门和屋顶采光窗的玻璃面积不得超过楼面面积的25%。”',
                  '他说：“为了防止热量流失，窗户、门和屋顶采光窗的玻璃面积不得超过楼面面积的25%。”',
              ),
              20: (
                  '全国购房者协会的乔纳森·罗兰德说：“这些规定的初衷虽然值得赞许，但在许多人已经觉得房价高到无法置业之际，它们还会进一步增加建房成本。”',
                  '全国购房者协会的乔纳森·罗兰德说：“这些规定的初衷虽然值得赞许，但在许多人已经觉得房价高到无法置业之际，它们还会进一步增加建房成本。”',
              ),
              24: (
                  '他说：“随着市场适应新的要求以及支撑这些要求的技术，这些技术实现规模化后最终会降低成本；但短期内，我们都必须为这场必要的转型付出代价。”',
                  '他说：“随着市场适应新的要求以及支撑这些要求的技术，这些技术实现规模化后最终会降低成本；但短期内，我们都必须为这场必要的转型付出代价。”',
              ),
          }
          # Some shard revisions already contain the closing quote in rows 14/20/24.
          # Row 10 is the known reviewed punctuation correction. All replacements are
          # idempotent and never alter English source text.
          for number, (old, new) in fixes.items():
              current = partb['rows'][number-1][2]
              if current not in {old, new}:
                  raise AssertionError(f'partb row {number} changed unexpectedly: {current!r}')
              partb['rows'][number-1][2] = new

          # Verify quote balance article-by-article after the reviewed punctuation repair.
          for article in source['articles']:
              en_balance = sum(r[1].count('“') - r[1].count('”') for r in article['rows'])
              zh_balance = sum(r[2].count('“') - r[2].count('”') for r in article['rows'])
              if en_balance or zh_balance:
                  raise AssertionError(f"{article['id']}: quote imbalance en={en_balance} zh={zh_balance}")

          out = curated / '2023.json'
          out.write_text(json.dumps(source, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(f'materialized {out} with {sum(len(a["rows"]) for a in source["articles"])} sentences')
          PY

      - name: Finalize and compile 2023
        run: |
          python content-pipeline/finalize_curated_year.py --year 2023
          python content-pipeline/build_curated_year.py --year 2023

      - name: Run canonical regressions
        run: |
          python -m unittest discover -s production_v2/tests -v
          if [ -f content-pipeline/tests/test_build_curated_year.py ]; then
            python -m unittest content-pipeline/tests/test_build_curated_year.py -v
          fi
          if [ -f content-pipeline/tests/test_bilingual_highlights.py ]; then
            python -m unittest content-pipeline/tests/test_bilingual_highlights.py -v
          fi

      - name: Run 2023 V2 canonical preflight
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          src=json.loads(Path('batch-manifests/2019-2024.json').read_text())
          year=2023
          src['years']=[year]
          src['expected_articles']={str(year):src['expected_articles'][str(year)]}
          Path('/tmp/2023-manifest.json').write_text(json.dumps(src,indent=2)+'\n')
          PY
          python -m production_v2.cli_validate_batch             --manifest /tmp/2023-manifest.json             --catalog kaoyan-reader-v1/content/catalog.json             --reader-root kaoyan-reader-v1             --phase preflight             --report reports/production-v2/2023-canonical-regression.json

      - name: Assert final 2023 evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          canary=json.loads(Path('reports/production-v2/2023-canary.json').read_text())
          assert canary['ok'] is True, canary
          assert canary['errors'] == [], canary['errors']
          assert canary['articles_checked'] == 7
          assert canary['reviewed_candidates_checked'] == 7
          assert canary['mapped_occurrences'] == canary['level6_vocab_occurrences_checked']
          expected={'cloze','text1','text2','text3','text4','partb','translation'}
          reader=Path('kaoyan-reader-v1/content/2023/c')
          assert {p.stem for p in reader.glob('*.json')} == expected
          print(json.dumps(canary, ensure_ascii=False, indent=2))
          PY

      - name: Commit reviewed 2023 outputs
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add             content-pipeline/curated/2023.json             content-pipeline/curated/bilingual-highlights/2023.json             content-pipeline/voice_profiles/2023.json             content-pipeline/direction/2023.json             kaoyan-reader-v1/content/catalog.json             kaoyan-reader-v1/content/2023             reports/bilingual-highlights/2023.json             reports/content-freeze/2023             reports/extraction/2023.json             reports/production-v2/2023-canary.json             reports/production-v2/2023-canonical-regression.json
          git diff --cached --check
          git commit -m 'build(c-mode): finalize reviewed 2023 [skip ci]'
          git push origin HEAD:c-mode-v2-2019-2024-production
