name: C v4 15-actor article preview contract

on:
  workflow_dispatch:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run article preview contract
        env:
          PYTHONPATH: voice-pipeline
        run: python -m unittest voice-pipeline/tests/test_article_preview.py -v
