name: C v4 actors 03 and 14 parallel repair round 4

on:
  pull_request:
    branches: ['c-v4-golden-set-qa2']
    paths:
      - 'voice-pipeline/calibration/repair_search_r4.py'
      - 'voice-pipeline/calibration/prepare_repair_references_r4.py'
      - 'voice-pipeline/calibration/render_repair_auditions_r4.py'
      - 'voice-pipeline/tests/test_six_actor_repair_r4.py'
      - '.github/workflows/c-v4-six-actor-repair-r4.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: c-v4-six-actor-repair-r4-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run actor 03/14 round-four contracts
        run: |
          PYTHONPATH=voice-pipeline python -m unittest voice-pipeline/tests/test_six_actor_repair_r4.py -v
          python -m py_compile \
            voice-pipeline/calibration/repair_search_r4.py \
            voice-pipeline/calibration/prepare_repair_references_r4.py \
            voice-pipeline/calibration/render_repair_auditions_r4.py

  repair-score-r4:
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        actor: ['03', '14']
    env:
      HF_HOME: /tmp/chatterbox-hf-cache
      TORCH_HOME: /tmp/torch-cache
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
      PYTHONUNBUFFERED: '1'
      PYTHONPATH: voice-pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/cache@v4
        with:
          path: |
            /tmp/chatterbox-hf-cache
            /tmp/torch-cache
          key: c-v4-six-actor-repair-models-v1
      - name: Install Chatterbox and QA dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install chatterbox-tts==0.1.7 numpy==1.26.4 soundfile==0.13.1 torch==2.6.0 torchaudio==2.6.0
      - name: Download original actor evidence
        uses: actions/download-artifact@v4
        with:
          name: c-v4-expansion-actor-${{ matrix.actor }}
          path: /tmp/original
          github-token: ${{ github.token }}
          repository: dannhitruong852-jpg/taptap
          run-id: 34740877351
      - name: Download round-one evidence
        uses: actions/download-artifact@v4
        with:
          name: c-v4-six-repair-${{ matrix.actor }}
          path: /tmp/r1
          github-token: ${{ github.token }}
          repository: dannhitruong852-jpg/taptap
          run-id: 34744873122
      - name: Download round-two evidence
        uses: actions/download-artifact@v4
        with:
          name: c-v4-six-repair-r2-${{ matrix.actor }}
          path: /tmp/r2
          github-token: ${{ github.token }}
          repository: dannhitruong852-jpg/taptap
          run-id: 34746310492
      - name: Download round-three evidence
        uses: actions/download-artifact@v4
        with:
          name: c-v4-six-repair-r3-${{ matrix.actor }}
          path: /tmp/r3
          github-token: ${{ github.token }}
          repository: dannhitruong852-jpg/taptap
          run-id: 34747938087
      - name: Download immutable Golden Set QA2 calibration
        uses: actions/download-artifact@v4
        with:
          name: c-v4-golden-set-qa2-calibration
          path: /tmp/calibration
          github-token: ${{ github.token }}
          repository: dannhitruong852-jpg/taptap
          run-id: 34743370177
      - name: Build round-four actor profile
        run: |
          python voice-pipeline/calibration/build_expansion_profiles.py --output /tmp/base-profiles
          mkdir -p /tmp/r4-profiles
          python - <<'PY'
          import json
          from pathlib import Path
          from calibration.repair_search_r4 import build_repair_r4_profile
          actor='${{ matrix.actor }}'
          base=json.loads((Path('/tmp/base-profiles')/f'{actor}.json').read_text(encoding='utf-8'))
          repaired=build_repair_r4_profile(base)
          (Path('/tmp/r4-profiles')/f'{actor}.json').write_text(json.dumps(repaired,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Prepare base plus round-four same-speaker references
        run: |
          python voice-pipeline/calibration/prepare_repair_references_r4.py \
            --actor '${{ matrix.actor }}' \
            --output '/tmp/references/actor${{ matrix.actor }}'
      - name: Render actor 03/14 round-four candidates in parallel
        run: |
          python voice-pipeline/calibration/render_repair_auditions_r4.py \
            --actor '${{ matrix.actor }}' \
            --profiles /tmp/r4-profiles \
            --references '/tmp/references/actor${{ matrix.actor }}' \
            --output 'actor-repair-r4/audio/actor${{ matrix.actor }}' \
            --device cpu
      - name: Verify bounded evidence and immutable rules
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from calibration.repair_search_r4 import REPAIR_R4_SPECS, REPAIR_R4_TARGETS
          actor='${{ matrix.actor }}'
          root=Path(f'actor-repair-r4/audio/actor{actor}')
          manifest=json.loads((root/f'actor{actor}-repair-r4.json').read_text())
          expected=sum(len(REPAIR_R4_SPECS[actor][i]['reference_states'])*len(REPAIR_R4_SPECS[actor][i]['controls']) for i in REPAIR_R4_TARGETS[actor])
          assert manifest['repair_round'] == 4
          assert len(manifest['renders']) == expected
          assert len(list(root.glob('*.wav'))) == expected
          assert len(list(root.glob('*.opus'))) == expected
          assert len(list(root.glob('*.mp3'))) == expected
          assert all(r['artificial_pause_ms'] == 0 for r in manifest['renders'])
          assert all(r['post_tempo'] is False for r in manifest['renders'])
          assert {r['intent'] for r in manifest['renders']} == set(REPAIR_R4_TARGETS[actor])
          PY
      - name: Score round-four audio with unchanged scorer
        run: |
          python voice-pipeline/calibration/score_auditions.py \
            --manifest 'actor-repair-r4/audio/actor${{ matrix.actor }}/actor${{ matrix.actor }}-repair-r4.json' \
            --profile '/tmp/r4-profiles/${{ matrix.actor }}.json' \
            --references '/tmp/references/actor${{ matrix.actor }}' \
            --output 'actor-repair-r4/scored/actor${{ matrix.actor }}.json'
      - name: Rejudge all evidence against unchanged QA2
        run: |
          mkdir -p actor-repair-r4/results actor-repair-r4/profiles actor-repair-r4/references/actor${{ matrix.actor }}
          python - <<'PY'
          import json
          from pathlib import Path
          from calibration.golden_set_qa import select_actor_calibration_qa2

          actor='${{ matrix.actor }}'
          calibration=json.loads(Path('/tmp/calibration/golden-calibration.json').read_text(encoding='utf-8'))
          assert calibration.get('qa_policy') == 'automated-c-v4-qa-2'
          assert calibration.get('golden_set_digest') == '9abde471e724f153362c57f35583ed83e79dd6b904f6827d6d6227116b0ffdbd'
          sources=[]
          for root in ('/tmp/original','/tmp/r1','/tmp/r2','/tmp/r3'):
              sources.append(json.loads((Path(root)/'scored'/f'actor{actor}.json').read_text(encoding='utf-8')))
          sources.append(json.loads((Path('actor-repair-r4/scored')/f'actor{actor}.json').read_text(encoding='utf-8')))
          combined={}
          for source in sources:
              for intent,items in source['candidates'].items():
                  combined.setdefault(intent,[]).extend(items)
          selected,rejected=select_actor_calibration_qa2(actor,combined,calibration)
          profile=json.loads((Path('/tmp/r4-profiles')/f'{actor}.json').read_text(encoding='utf-8'))
          if selected:
              profile['selected_candidates']={intent:{
                  'variant':item['variant'], 'reference_state':item.get('reference_state'),
                  'exaggeration':item['exaggeration'], 'cfg_weight':item['cfg_weight'],
                  'temperature':item['temperature'], 'repetition_penalty':item['repetition_penalty'],
              } for intent,item in selected.items()}
              profile['eligible']=True
              profile['eligible_for']=['production']
          result={
              'schema_version':'c-v4-six-actor-repair-result-4',
              'actor_id':actor,
              'repair_round':4,
              'qa_policy':calibration['qa_policy'],
              'golden_set_digest':calibration['golden_set_digest'],
              'status':'accepted' if selected else 'failed',
              'selected_variants':{intent:item['variant'] for intent,item in selected.items()},
              'selected':selected,
              'failures':rejected,
          }
          (Path('actor-repair-r4/results')/f'actor{actor}.json').write_text(json.dumps(result,indent=2)+'\n',encoding='utf-8')
          (Path('actor-repair-r4/profiles')/f'{actor}.json').write_text(json.dumps(profile,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({'actor_id':actor,'status':result['status'],'failed_intents':list(rejected)},indent=2))
          PY
          cp '/tmp/references/actor${{ matrix.actor }}/actor${{ matrix.actor }}.json' 'actor-repair-r4/references/actor${{ matrix.actor }}/provenance.json'
      - uses: actions/upload-artifact@v4
        with:
          name: c-v4-six-repair-r4-${{ matrix.actor }}
          path: actor-repair-r4
          if-no-files-found: error
          retention-days: 14

  aggregate-r4:
    needs: repair-score-r4
    if: always() && needs.repair-score-r4.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: c-v4-six-repair-r4-*
          path: /tmp/r4
          merge-multiple: true
      - name: Summarize actor 03/14 round four
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          results=[json.loads((Path('/tmp/r4/results')/f'actor{a}.json').read_text()) for a in ('03','14')]
          summary={
              'schema_version':'c-v4-six-actor-repair-round-4',
              'qa_policy':'automated-c-v4-qa-2',
              'accepted':[r['actor_id'] for r in results if r['status']=='accepted'],
              'still_failed':[r['actor_id'] for r in results if r['status']!='accepted'],
              'results':results,
              'immutable_rules':{'artificial_pause_ms':0,'post_tempo':False,'qa_thresholds_lowered':False},
          }
          Path('actor-03-14-repair-r4-summary.json').write_text(json.dumps(summary,indent=2)+'\n')
          print(json.dumps({k:summary[k] for k in ('accepted','still_failed')},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: c-v4-six-actor-repair-r4-summary
          path: actor-03-14-repair-r4-summary.json
          if-no-files-found: error
          retention-days: 30
