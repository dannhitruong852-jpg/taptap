name: Align 2008 word timings once

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'word-alignment-2008.trigger'

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU alignment runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
      - name: Align 2008 sentence audio to source words
        env:
          PYTHONPATH: voice-pipeline
        run: python voice-pipeline/alignment/align_manifests.py --year 2008 --root kaoyan-reader-v1
      - name: Commit aligned manifests to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kaoyan-reader-v1/audio/2008/*/manifest.json kaoyan-reader-v1/audio/2008/v4/*/manifest.json kaoyan-reader-v1/reports/c-v4-2008-alignment.json
          if git diff --cached --quiet; then
            echo "No alignment changes"
            exit 0
          fi
          git commit -m "data: attach 2008 word-level audio timings"
          git push origin HEAD:gh-pages
