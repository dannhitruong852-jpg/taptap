name: Audit generated vocabulary and bilingual coverage once

on:
  push:
    branches: [c-v4-article-preview-actual]
    paths:
      - '.github/workflows/audit-generated-vocab-bilingual-once.yml'
      - 'scripts/build_2007_2012_vocabulary.py'

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download ECDICT
        run: curl -L --retry 3 --fail -o /tmp/ecdict.csv https://raw.githubusercontent.com/skywind3000/ECDICT/master/ecdict.csv
      - name: Build candidate vocabulary
        run: python scripts/build_2007_2012_vocabulary.py --root . --ecdict /tmp/ecdict.csv --output-dir /tmp/vocab --threshold 0.75
      - name: Audit exact Chinese gloss coverage
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          units=('cloze','text1','text2','text3','text4','partb','translation')
          for year in range(2007,2013):
              vocab=json.loads(Path(f'/tmp/vocab/{year}/vocabulary-1-9.json').read_text())['vocabulary']
              total=literal=0; unresolved=[]
              for unit in units:
                  doc=json.loads(Path(f'reports/content-freeze/{year}/{unit}.candidate.json').read_text())
                  for i,row in enumerate(doc['article']['rows'],1):
                      en=row[1].replace('|',''); zh=row[2]
                      for lemma,entry in vocab.items():
                          level,meaning,*variants=entry
                          for surface in [lemma,*variants]:
                              for m in re.finditer(r'(?<![\w-])'+re.escape(surface)+r'(?![\w-])',en,flags=re.I):
                                  total+=1
                                  candidates=[]
                                  for part in re.split(r'[；;，,、/]',meaning):
                                      p=re.sub(r'[（(].*?[)）]','',part).strip()
                                      if p and p in zh and p not in candidates: candidates.append(p)
                                  if candidates:
                                      literal+=1
                                  else:
                                      unresolved.append({'unit':unit,'sentence':i,'word':m.group(),'lemma':lemma,'level':level,'meaning':meaning,'zh':zh,'en':en})
              print('YEAR',year,'vocab=',len(vocab),'occurrences=',total,'literal=',literal,'unresolved=',len(unresolved),'literal_rate=',round(literal/max(1,total),4))
              print('UNRESOLVED_SAMPLE',json.dumps(unresolved[:30],ensure_ascii=False))
          PY
