name: Launch C Mode 2013-2018 production once

on:
  push:
    branches:
      - c-mode-v2-2013-2018-production
    paths:
      - '.github/workflows/c-mode-launch-2013-2018-once.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  launch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch validated production pipeline without publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run c-mode-production-v2.yml \
            -R "$GITHUB_REPOSITORY" \
            --ref c-mode-v2-2013-2018-production \
            -f batch_manifest=batch-manifests/2013-2018.json \
            -f publish=false \
            -f shards=3
          echo "Dispatched C Mode Production V2 for 2013-2018 (publish=false)." >> "$GITHUB_STEP_SUMMARY"
