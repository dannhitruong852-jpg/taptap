name: C v4 Golden Set QA2

on:
  pull_request:
    branches: ['codex/-c-v4']
    paths:
      - 'voice-pipeline/**'
      - '.github/workflows/c-v4-golden-set-qa2.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Golden Set QA2 contracts
        run: |
          PYTHONPATH=voice-pipeline python -m unittest \
            voice-pipeline/tests/test_golden_set_qa2.py \
            voice-pipeline/tests/test_golden_set_all_variants.py -v

  golden-score:
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        actor: ['01', '02', '04', '05', '08', '09', '12', '13']
    env:
      TORCH_HOME: /tmp/torch-cache
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/cache@v4
        with:
          path: /tmp/torch-cache
          key: c-v4-golden-qa2-torch-v1
      - name: Install scoring dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install numpy==1.26.4 soundfile==0.13.1 torch==2.6.0 torchaudio==2.6.0
      - name: Download historical human-approved audition artifact
        uses: actions/download-artifact@v4
        with:
          name: c-v4-audition-actor-${{ matrix.actor }}
          path: /tmp/historical
          github-token: ${{ github.token }}
          repository: dannhitruong852-jpg/taptap
          run-id: 34700029729
      - name: Prepare the exact actor's licensed reference set
        run: |
          python voice-pipeline/prepare_2002_cast_references.py \
            --actor '${{ matrix.actor }}' \
            --output '/tmp/references'
      - name: Score the historical human-approved A/B/C battery with the current scorer
        run: |
          python voice-pipeline/calibration/score_auditions.py \
            --manifest '/tmp/historical/audio/actor${{ matrix.actor }}/actor${{ matrix.actor }}-auditions.json' \
            --profile 'voice-pipeline/calibration/actors/${{ matrix.actor }}.json' \
            --references '/tmp/references' \
            --output 'golden-scored/actor${{ matrix.actor }}.json'
      - uses: actions/upload-artifact@v4
        with:
          name: c-v4-golden-scored-${{ matrix.actor }}
          path: golden-scored/actor${{ matrix.actor }}.json
          if-no-files-found: error
          retention-days: 14

  golden-calibrate:
    needs: golden-score
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: c-v4-golden-scored-*
          path: /tmp/golden-scored
          merge-multiple: true
      - name: Build immutable QA2 Golden Set calibration
        env:
          PYTHONPATH: voice-pipeline
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from calibration.golden_set_qa import GOLDEN_ACTORS, build_golden_calibration

          scored = {}
          for actor in GOLDEN_ACTORS:
              path = Path('/tmp/golden-scored') / f'actor{actor}.json'
              scored[actor] = json.loads(path.read_text(encoding='utf-8'))
          approvals = json.loads(Path('voice-pipeline/calibration/actors/production_approvals.json').read_text(encoding='utf-8'))
          calibration = build_golden_calibration(scored, approvals)
          Path('golden-calibration.json').write_text(json.dumps(calibration, indent=2) + '\n', encoding='utf-8')
          print(json.dumps({
              'qa_policy': calibration['qa_policy'],
              'golden_set': calibration['golden_set'],
              'benchmark_anchor': calibration['benchmark_anchor'],
              'golden_set_digest': calibration['golden_set_digest'],
          }, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: c-v4-golden-set-qa2-calibration
          path: golden-calibration.json
          if-no-files-found: error
          retention-days: 30
