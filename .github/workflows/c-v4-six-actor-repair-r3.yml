name: C v4 six-actor repair round 3

on:
  pull_request:
    branches: ['c-v4-golden-set-qa2']
    paths:
      - 'voice-pipeline/calibration/repair_search_r3.py'
      - 'voice-pipeline/calibration/render_repair_auditions_r3.py'
      - 'voice-pipeline/tests/test_six_actor_repair_r3.py'
      - '.github/workflows/c-v4-six-actor-repair-r3.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: c-v4-six-actor-repair-r3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run repair round-three contracts
        run: PYTHONPATH=voice-pipeline python -m unittest voice-pipeline/tests/test_six_actor_repair_r3.py -v
