name: Voice pipeline unit tests

on:
  push:
    branches: [kaoyan-reader-v1]
    paths:
      - '.github/workflows/voice-unit-tests.yml'
      - 'voice-pipeline/tests/**'
      - 'voice-pipeline/batching.py'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run batching tests
        run: PYTHONPATH=voice-pipeline python -m unittest voice-pipeline/tests/test_batching.py
