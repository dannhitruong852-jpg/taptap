name: phrasebook-target-top-v2-tdd
on:
  push:
    branches: [fix-phrasebook-target-top-v2-20260929]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kaoyan-reader-v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: kaoyan-reader-v1/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run test:dom
