name: Reader pipeline checks
on:
  push:
    branches: [kaoyan-reader-v1, c-v4-2002-complete]
    paths:
      - '.github/workflows/**'
      - 'content-pipeline/**'
      - 'voice-pipeline/**'
      - 'kaoyan-reader-v1/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build curated 2002 content
        run: PYTHONPATH=content-pipeline python content-pipeline/build_2002.py
      - name: Content tests
        id: content
        continue-on-error: true
        run: PYTHONPATH=content-pipeline python -m unittest discover -s content-pipeline/tests -v
      - name: Voice tests
        id: voice
        continue-on-error: true
        run: PYTHONPATH=voice-pipeline python -m unittest discover -s voice-pipeline/tests -v
      - name: Reader tests
        id: reader
        continue-on-error: true
        working-directory: kaoyan-reader-v1
        run: npm test
      - name: Install browser verification
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Browser interaction tests
        id: browser
        continue-on-error: true
        run: python kaoyan-reader-v1/tests/reader-ux-browser.py
      - name: Save exact source snapshot
        if: always()
        run: git archive --format=tar HEAD | gzip > /tmp/reader-source.tar.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reader-source-${{ github.sha }}
          path: /tmp/reader-source.tar.gz
          retention-days: 3
      - name: Require all suites
        if: always()
        env:
          CONTENT: ${{ steps.content.outcome }}
          VOICE: ${{ steps.voice.outcome }}
          READER: ${{ steps.reader.outcome }}
          BROWSER: ${{ steps.browser.outcome }}
        run: |
          printf 'content=%s voice=%s reader=%s browser=%s\n' "$CONTENT" "$VOICE" "$READER" "$BROWSER"
          test "$CONTENT" = success
          test "$VOICE" = success
          test "$READER" = success
          test "$BROWSER" = success
