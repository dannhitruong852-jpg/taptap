plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ruanxiaomi.reader'
    compileSdk 35

    defaultConfig {
        applicationId 'com.ruanxiaomi.reader'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
        buildConfigField 'String', 'READER_URL', '"https://dannhitruong852-jpg.github.io/taptap/kaoyan-reader-v1/"'
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.work:work-runtime:2.10.0'
}
